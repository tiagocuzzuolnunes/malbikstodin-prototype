name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run check:budget

      # Lint is informational until pre-existing purity/refresh violations are cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true
